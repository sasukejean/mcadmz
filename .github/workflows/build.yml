
name: Build mcadmz
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar jar do Comes Alive
        run: |
          ls -la libs
          f=$(ls libs/*.jar | grep -i -E "comes|mca" | head -n 1)
          cp "$f" libs/mca-7.7.1.jar.tmp && rm -f libs/*.jar && mv libs/mca-7.7.1.jar.tmp libs/mca-7.7.1.jar
          ls -la libs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1
      - name: Compilar
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mcadmz-jar
          path: build/libs/*.jar
